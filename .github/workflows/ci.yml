name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  windows:
    # windows-latest imajında 7-Zip kurulu: 7z.dll testleri (Faz 0 çıkış kriteri) burada gerçekten çalışır.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Testler (7-Zip motoru dahil)
        run: dotnet test --project tests/AfuZip.Tests -c Release

      - name: CLI duman testi
        shell: pwsh
        run: |
          dotnet run --project src/AfuZip.Cli -c Release -- formats
          New-Item -ItemType Directory -Force smoke/kaynak | Out-Null
          Set-Content smoke/kaynak/çiçek.txt "Merhaba dünya"
          # 7z.exe göreli yolu olduğu gibi saklar; arşivin kökü 'kaynak' olsun diye klasörün içinden çalıştırılır.
          Push-Location smoke
          & "C:\Program Files\7-Zip\7z.exe" a test.7z kaynak | Out-Null
          Pop-Location
          dotnet run --project src/AfuZip.Cli -c Release -- list smoke/test.7z
          dotnet run --project src/AfuZip.Cli -c Release -- t smoke/test.7z
          if ($LASTEXITCODE -ne 0) { throw "7z test başarısız" }
          dotnet run --project src/AfuZip.Cli -c Release -- x smoke/test.7z -o smoke/out
          if ((Get-Content smoke/out/kaynak/çiçek.txt) -ne "Merhaba dünya") { throw "7z çıkarma sonucu hatalı" }
          # Akıllı çıkarma: tek kök klasör ('kaynak') arşivin yanına çıkar
          Remove-Item -Recurse -Force smoke/kaynak
          dotnet run --project src/AfuZip.Cli -c Release -- x smoke/test.7z
          if (-not (Test-Path smoke/kaynak/çiçek.txt)) { throw "akıllı çıkarma hatalı" }
          # Faz 3: oluşturma, parola + başlık şifreleme, cilt bölme, düzenleme
          dotnet run --project src/AfuZip.Cli -c Release -- a smoke/yeni.7z smoke/kaynak -m max -p Parola1 -he
          if ($LASTEXITCODE -ne 0) { throw "7z oluşturma başarısız" }
          dotnet run --project src/AfuZip.Cli -c Release -- t smoke/yeni.7z -p Parola1
          if ($LASTEXITCODE -ne 0) { throw "şifreli 7z testi başarısız" }
          dotnet run --project src/AfuZip.Cli -c Release -- a smoke/yedek.tar.gz smoke/kaynak
          if ($LASTEXITCODE -ne 0) { throw "tar.gz oluşturma başarısız" }
          dotnet run --project src/AfuZip.Cli -c Release -- l smoke/yedek.tar.gz
          dotnet run --project src/AfuZip.Cli -c Release -- rn smoke/test.7z kaynak/çiçek.txt gül.txt
          if ($LASTEXITCODE -ne 0) { throw "yeniden adlandırma başarısız" }
          dotnet run --project src/AfuZip.Cli -c Release -- d smoke/test.7z kaynak/gül.txt
          if ($LASTEXITCODE -ne 0) { throw "silme başarısız" }
          dotnet run --project src/AfuZip.Cli -c Release -- l smoke/test.7z

      - name: Uygulama (x64)
        run: dotnet build src/AfuZip.App -c Release -p:Platform=x64

      # Explorer eklentisi ve Windows 11 menü paketi: kendinden imzalı test sertifikasıyla imzalanıp bu makinede
      # güvenilir yapılır (dağıtılan sürüm böyle imzalanmaz).
      - name: Explorer eklentisi (x64, test imzalı paket)
        shell: pwsh
        run: |
          $bin = (Get-ChildItem src/AfuZip.App/bin/x64/Release -Recurse -Filter AfuZip.exe | Select-Object -First 1).DirectoryName
          ./tools/test-cert.ps1 -Out "$env:RUNNER_TEMP/cert"
          ./tools/build-shell.ps1 -Platform x64 -Out $bin -Version 0.0.1 -Publisher 'CN=AFU Zip Test' `
            -Certificate "$env:RUNNER_TEMP/cert/test.pfx" -Password afuzip-test

      # Kurulum programının yaptığı kayıt: klasik menü eklentiye yönlenir, Windows 11 menü paketi kurulur, kaldırınca
      # hepsi temizlenir.
      - name: Explorer kaydı (--register / --unregister)
        shell: pwsh
        run: |
          $exe = (Get-ChildItem src/AfuZip.App/bin/x64/Release -Recurse -Filter AfuZip.exe | Select-Object -First 1).FullName
          $p = Start-Process -FilePath $exe -ArgumentList '--register' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "--register çıkış kodu $($p.ExitCode)" }
          $handler = (Get-ItemProperty -LiteralPath 'HKCU:\Software\Classes\*\shell\AfuZip').ExplorerCommandHandler
          if ($handler -ne '{4538D22E-A004-4452-8898-AF47558519CB}') { throw "Klasik menü eklentiye bağlanmadı: '$handler'" }
          $dll = (Get-ItemProperty -LiteralPath 'HKCU:\Software\Classes\CLSID\{4538D22E-A004-4452-8898-AF47558519CB}\InprocServer32').'(default)'
          if (-not (Test-Path $dll)) { throw "Eklenti DLL'i yok: $dll" }
          $package = Get-AppxPackage -Name AfuZip.ContextMenu
          Write-Host "Windows 11 menü paketi: $($package.PackageFullName) → $($package.InstallLocation)"
          if (-not $package) {
            $log = Join-Path $env:LOCALAPPDATA 'AfuZip\logs\afuzip.log'
            if (Test-Path $log) { Get-Content $log | Write-Host }
            throw "Sparse paket kurulmadı"
          }
          $p = Start-Process -FilePath $exe -ArgumentList '--unregister' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "--unregister çıkış kodu $($p.ExitCode)" }
          if (Test-Path -LiteralPath 'HKCU:\Software\Classes\*\shell\AfuZip') { throw "Klasik menü kaldırılmadı" }
          if (Get-AppxPackage -Name AfuZip.ContextMenu) { throw "Sparse paket kaldırılmadı" }
          Write-Host "Kayıt ve kaldırma çalıştı"

      # Uygulamanın kendisi, uçtan uca: sağ tık "arşiv adıyla klasöre çıkar" komutu ilerleme penceresiyle çalışır,
      # iş bitince pencere kendiliğinden kapanır ve süreç sonlanır.
      - name: Uygulama duman testi (sağ tık komutu)
        shell: pwsh
        run: |
          $exe = Get-ChildItem src/AfuZip.App/bin/x64/Release -Recurse -Filter AfuZip.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force appsmoke/kaynak | Out-Null
          Set-Content appsmoke/kaynak/not.txt "AFU Zip"
          Push-Location appsmoke
          & "C:\Program Files\7-Zip\7z.exe" a paket.7z kaynak | Out-Null
          Pop-Location
          $archive = Join-Path $PWD 'appsmoke\paket.7z'
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '--extract-folder', "`"$archive`"" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "Uygulama 2 dakikada kapanmadı" }
          if (-not (Test-Path appsmoke/paket/kaynak/not.txt)) { throw "Çıkarılan dosya yok (çıkış kodu $($p.ExitCode))" }
          Write-Host "Sağ tık komutu çalıştı, çıkış kodu $($p.ExitCode)"

      # Explorer çok seçimde komutu her dosya için ayrı süreçte başlatır: iki istek tek arşivde birleşmeli.
      - name: Uygulama duman testi (çok seçimle sıkıştırma)
        shell: pwsh
        run: |
          $exe = (Get-ChildItem src/AfuZip.App/bin/x64/Release -Recurse -Filter AfuZip.exe | Select-Object -First 1).FullName
          New-Item -ItemType Directory -Force appsmoke/coklu | Out-Null
          Set-Content appsmoke/coklu/a.txt "bir"
          Set-Content appsmoke/coklu/b.txt "iki"
          $first = Start-Process -FilePath $exe -ArgumentList '--compress', 'balanced', "`"$PWD\appsmoke\coklu\a.txt`"" -PassThru
          Start-Sleep -Milliseconds 300
          $second = Start-Process -FilePath $exe -ArgumentList '--compress', 'balanced', "`"$PWD\appsmoke\coklu\b.txt`"" -PassThru
          foreach ($p in $first, $second) {
            if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "Uygulama 2 dakikada kapanmadı" }
          }
          $archives = @(Get-ChildItem appsmoke/coklu -Filter *.7z)
          if ($archives.Count -ne 1) { throw "Tek arşiv bekleniyordu, $($archives.Count) bulundu: $($archives.Name -join ', ')" }
          $list = & "C:\Program Files\7-Zip\7z.exe" l $archives[0].FullName
          if (-not (($list -match 'a\.txt') -and ($list -match 'b\.txt'))) { $list; throw "Arşivde iki dosya da yok" }
          Write-Host "Birleşik arşiv: $($archives[0].Name)"

      - name: Uygulama (ARM64)
        run: dotnet build src/AfuZip.App -c Release -p:Platform=ARM64

      - name: Explorer eklentisi (ARM64)
        shell: pwsh
        run: ./tools/build-shell.ps1 -Platform ARM64 -Out "$env:RUNNER_TEMP/shell-arm64"

      - name: Kurulum programı (deneme derlemesi)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $bin = (Get-ChildItem src/AfuZip.App/bin/x64/Release -Recurse -Filter AfuZip.exe | Select-Object -First 1).DirectoryName
          & $iscc /Q /DAppVersion=0.0.1 /DArch=x64 "/DSourceDir=$bin" installer/AfuZip.iss
          if ($LASTEXITCODE) { throw "Kurulum programı derlenemedi" }
          Get-ChildItem artifacts/*.exe | Format-Table Name, Length

      # Kurulum programının kendisi: sessiz kurulum → dosyalar ve Explorer kaydı yerinde mi, kaldırınca temizleniyor mu.
      - name: Kurulum programı (sessiz kur ve kaldır)
        shell: pwsh
        run: |
          $setup = (Get-ChildItem artifacts/AfuZip-*-setup-x64.exe | Select-Object -First 1).FullName
          $p = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Kurulum çıkış kodu $($p.ExitCode)" }
          $app = Join-Path $env:LOCALAPPDATA 'Programs\AFU Zip'
          foreach ($f in 'AfuZip.exe', 'AfuZip.ShellExtension.dll', 'unins000.exe') {
            if (-not (Test-Path (Join-Path $app $f))) { throw "Kurulumda eksik: $f" }
          }
          $handler = (Get-ItemProperty -LiteralPath 'HKCU:\Software\Classes\*\shell\AfuZip').ExplorerCommandHandler
          if (-not $handler) { throw "Kurulum Explorer menüsünü eklemedi" }
          $registered = (Get-ItemProperty -LiteralPath 'HKCU:\Software\AfuZip').ShellExePath
          if ($registered -ne (Join-Path $app 'AfuZip.exe')) { throw "Menü yanlış exe'yi gösteriyor: $registered" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\AFU Zip.lnk")) { throw "Başlat menüsü kısayolu yok" }
          Write-Host "Kuruldu: $app"
          $u = Start-Process -FilePath (Join-Path $app 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -PassThru -Wait
          if ($u.ExitCode -ne 0) { throw "Kaldırma çıkış kodu $($u.ExitCode)" }
          Start-Sleep -Seconds 3
          if (Test-Path -LiteralPath 'HKCU:\Software\Classes\*\shell\AfuZip') { throw "Kaldırınca Explorer menüsü kaldı" }
          if (Test-Path (Join-Path $app 'AfuZip.exe')) { throw "Kaldırınca program dosyaları kaldı" }
          Write-Host "Kurulum ve kaldırma çalıştı"

  linux:
    # Yönetilen motor ve güvenlik testleri platformdan bağımsızdır.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet test --project tests/AfuZip.Tests -c Release
      - name: Eklenti ad kuralları (C++)
        run: g++ -std=c++17 -Wall -Wextra -Werror -o naming_test src/AfuZip.ShellExtension/tests/naming_test.cpp && ./naming_test
