name: release

# v ile başlayan bir etiket gönderilince (git tag v0.4.0 && git push --tags) Windows için
# kurulum gerektirmeyen zip paketleri derlenir ve GitHub Releases'e yüklenir.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  package:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - platform: x64
            rid: win-x64
          - platform: ARM64
            rid: win-arm64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/AfuZip.Preview.Web/package-lock.json

      # .NET ve Windows App SDK pakete dahil: hedef bilgisayarda hiçbir şey kurulu olmasa da çalışır.
      - name: Yayımla
        run: dotnet publish src/AfuZip.App -c Release -p:Platform=${{ matrix.platform }} -r ${{ matrix.rid }} --self-contained true -o publish/AfuZip

      - name: Paketi denetle ve sıkıştır
        shell: pwsh
        run: |
          foreach ($f in 'AfuZip.exe', 'PreviewWeb/index.html', 'Assets/AfuZip.ico') {
            if (-not (Test-Path "publish/AfuZip/$f")) { throw "Pakette eksik: $f" }
          }
          $name = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'dev' }
          Compress-Archive -Path publish/AfuZip -DestinationPath "AfuZip-$name-${{ matrix.rid }}.zip"
          Get-ChildItem *.zip | Format-Table Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: AfuZip-${{ matrix.rid }}
          path: AfuZip-*.zip
          if-no-files-found: error

  publish:
    needs: package
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Sürümü oluştur
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          Kurulum gerektirmez: zip'i bir klasöre açın ve `AfuZip.exe`'yi çalıştırın.

          - **x64**: çoğu bilgisayar. **ARM64**: Snapdragon işlemcili Windows bilgisayarlar.
          - 7z, RAR ve diğer biçimler için bilgisayarınızda [7-Zip](https://www.7-zip.org/) (ya da Zstandard için [7-Zip ZS](https://github.com/mcmilk/7-Zip-zstd)) kurulu olmalı; yoksa yalnızca zip, tar ve gzip açılır.
          - Explorer sağ tık menüsü için uygulamada **Ayarlar → Explorer sağ tık menüsü**'nü açın.
          - Windows SmartScreen imzasız olduğu için uyarabilir: "Ek bilgi → Yine de çalıştır".
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/*.zip --repo "$GITHUB_REPOSITORY" --title "AFU Zip $GITHUB_REF_NAME" --notes-file notes.md --prerelease
