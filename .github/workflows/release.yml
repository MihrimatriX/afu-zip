name: release

# Directory.Build.props'taki <Version> yükseltilip main'e gönderilince (ya da elle çalıştırılınca) o sürüm henüz
# yayınlanmadıysa Windows için kurulum programı ve kurulum gerektirmeyen zip paketleri derlenir; etiket ve sürüm
# GitHub'da oluşturulur.
#
# İmza henüz yok: Windows 11 menü paketi (sparse MSIX) üretilmez, klasik menü kullanılır. SignPath Foundation onayından
# sonra eklenecek adımlar SIGNING.md'de.
on:
  push:
    branches: [main]
    paths:
      - Directory.Build.props
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag zaten yayınlanmış; yeni paket yok."
          else
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "Yayınlanacak: $tag"
          fi

  package:
    needs: version
    if: needs.version.outputs.tag != ''
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - platform: x64
            rid: win-x64
          - platform: ARM64
            rid: win-arm64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # .NET ve Windows App SDK pakete dahil: hedef bilgisayarda hiçbir şey kurulu olmasa da çalışır.
      - name: Yayımla
        run: dotnet publish src/AfuZip.App -c Release -p:Platform=${{ matrix.platform }} -r ${{ matrix.rid }} --self-contained true -o publish/AfuZip

      - name: Explorer eklentisi
        shell: pwsh
        run: |
          $version = '${{ needs.version.outputs.tag }}'.TrimStart('v')
          ./tools/build-shell.ps1 -Platform ${{ matrix.platform }} -Out publish/AfuZip -Version $version

      - name: Paketi denetle ve sıkıştır
        shell: pwsh
        run: |
          foreach ($f in 'AfuZip.exe', 'AfuZip.ShellExtension.dll', 'Assets/AfuZip.ico') {
            if (-not (Test-Path "publish/AfuZip/$f")) { throw "Pakette eksik: $f" }
          }
          Compress-Archive -Path publish/AfuZip -DestinationPath "AfuZip-${{ needs.version.outputs.tag }}-${{ matrix.rid }}.zip"
          Get-ChildItem *.zip | Format-Table Name, Length

      - name: Kurulum programı
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $version = '${{ needs.version.outputs.tag }}'.TrimStart('v')
          $arch = '${{ matrix.platform }}'.ToLowerInvariant()
          & $iscc /Q "/DAppVersion=$version" "/DArch=$arch" "/DSourceDir=$PWD\publish\AfuZip" installer/AfuZip.iss
          if ($LASTEXITCODE) { throw "Kurulum programı derlenemedi" }
          Move-Item artifacts/AfuZip-*-setup-*.exe .
          Get-ChildItem *.exe | Format-Table Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: AfuZip-${{ matrix.rid }}
          path: |
            AfuZip-*.zip
            AfuZip-*-setup-*.exe
          if-no-files-found: error

  publish:
    needs: [version, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Sürümü oluştur
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          cat > notes.md <<'NOTES'
          **Kurulum programı (önerilen):** `AfuZip-…-setup-x64.exe`. Yönetici izni istemez; Başlat menüsüne ekler,
          Explorer sağ tık menüsünü ve "Birlikte aç" kaydını açar, Program Ekle/Kaldır'dan kaldırılır.

          **Taşınabilir:** zip'i bir klasöre açın, `AfuZip.exe`'yi çalıştırın; sağ tık menüsü için başlangıç ekranındaki
          "Ekle" düğmesi ya da **Ayarlar → Explorer sağ tık menüsü**.

          - **x64**: çoğu bilgisayar. **ARM64**: Snapdragon işlemcili Windows bilgisayarlar.
          - 7z, RAR ve diğer biçimler için bilgisayarınızda [7-Zip](https://www.7-zip.org/) (ya da Zstandard için [7-Zip ZS](https://github.com/mcmilk/7-Zip-zstd)) kurulu olmalı; yoksa yalnızca zip, tar ve gzip açılır.
          - Windows 11'de menü şimdilik "Daha fazla seçenek göster" altında (7-Zip gibi). Üstteki yeni menü imzalı
            sürümle gelecek.
          - Windows SmartScreen imzasız olduğu için uyarabilir: "Ek bilgi → Yine de çalıştır".
          NOTES
          gh release create "$TAG" dist/*.zip dist/*.exe --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "AFU Zip $TAG" --notes-file notes.md --prerelease
