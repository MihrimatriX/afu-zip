<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Arşivden gelen içerik güvenilmez: betik yalnızca uygulamanın kendi dosyalarından çalışır,
      dışarıya istek atılmaz, arşiv içeriği yalnızca resim olarak (content.afuzip.preview) yüklenir.
      Monaco stil etiketlerini çalışma anında eklediği için style-src 'unsafe-inline' gerekir.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://content.afuzip.preview; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-src 'none'; object-src 'none'"
    />
    <title>AFU Zip önizleme</title>
  </head>
  <body data-theme="light">
    <header id="toolbar" hidden>
      <div id="banner" role="status"></div>
      <div id="modes" role="tablist" aria-label="Görünüm">
        <button type="button" role="tab" data-mode="rendered" aria-selected="true">Görünüm</button>
        <button type="button" role="tab" data-mode="source" aria-selected="false">Kaynak</button>
      </div>
    </header>
    <main id="stage">
      <div id="code" hidden></div>
      <div id="rendered" hidden tabindex="0"></div>
      <div id="empty"></div>
    </main>
    <footer id="status" hidden></footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
